[package]
name = "tortos-installer"
version = "2.0.0"
description = "Puts TortOS on a TrimUI Brick or GKD Pixel 2 card, or updates one"
authors = ["Eric Reinsmidt"]
license = "MIT"
edition = "2021"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# The Pixel 2's image is .img.xz: a pure-Rust decoder, so nothing to link on
# three systems, and no encoder
lzma-rust2 = { version = "0.20", default-features = false, features = ["std", "xz"] }
# The Brick's release is a .zip, deflated or stored: a pure-Rust inflater only
zip = { version = "8", default-features = false, features = ["deflate-flate2-zlib-rs"] }
# Downloads from GitHub: rustls with its own root certificates, so nothing
# to install alongside on Linux
ureq = { version = "3", default-features = false, features = ["rustls"] }
sha2 = "0.11"

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[target.'cfg(target_os = "macos")'.dependencies]
plist = "1"

[target.'cfg(windows)'.dependencies]
windows = { version = "0.58", features = ["Win32_Foundation", "Win32_Security", "Win32_Storage_FileSystem", "Win32_System_IO", "Win32_System_Ioctl"] }

[dev-dependencies]
# The tests make their own .xz images
lzma-rust2 = { version = "0.20", default-features = false, features = ["std", "xz", "encoder"] }

[profile.release]
opt-level = "s"
lto = true
strip = true

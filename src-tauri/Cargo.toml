[package]
name = "tortos-installer"
version = "0.1.0"
description = "Puts TortOS on a TrimUI Brick or GKD Pixel 2 card, or updates one"
authors = ["Eric Reinsmidt"]
license = "MIT"
edition = "2021"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
opt-level = "s"
lto = true
strip = true

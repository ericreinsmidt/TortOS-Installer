[package]
name = "tortos-installer"
version = "0.1.0"
description = "Puts TortOS on a TrimUI Brick or GKD Pixel 2 card, or updates one"
authors = ["Eric Reinsmidt"]
license = "MIT"
edition = "2021"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[target.'cfg(target_os = "macos")'.dependencies]
plist = "1"

[target.'cfg(windows)'.dependencies]
windows = { version = "0.58", features = ["Win32_Foundation", "Win32_Security", "Win32_Storage_FileSystem", "Win32_System_IO", "Win32_System_Ioctl"] }

[profile.release]
opt-level = "s"
lto = true
strip = true

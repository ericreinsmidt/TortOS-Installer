<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>TortOS Installer</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<div class="window">
	<header>
		<img src="mark.svg" alt="">
		<span class="wordmark"><span class="tort">Tort</span><span class="os">OS</span></span>
		<span class="sub">Installer</span>
		<span class="ver">2.0</span>
	</header>

	<h2>Device</h2>
	<div class="pair" data-group="device">
		<button class="choice" data-value="brick"><b>TrimUI Brick</b><span>Brick and Brick Hammer</span></button>
		<button class="choice on" data-value="pixel"><b>GKD Pixel 2</b><span>TortOS on plastron</span></button>
	</div>

	<h2>Card</h2>
	<div class="card">
		<svg width="30" height="38" viewBox="0 0 30 38" aria-hidden="true">
			<path d="M3 1h17l9 9v25a2 2 0 0 1-2 2H3a2 2 0 0 1-2-2V3a2 2 0 0 1 2-2z" fill="none" stroke="#3dd6ff" stroke-width="2"/>
			<path d="M8 5v6M12 5v6M16 5v6" stroke="#3dd6ff" stroke-width="2"/>
		</svg>
		<div>
			<div class="name">TORTOS &middot; 62.5 GB</div>
			<div class="what"><span class="found">TortOS 1.3.0 for the Pixel 2</span> &middot; 249 games, 108 songs</div>
		</div>
		<select aria-label="Card"><option>Built-in SD reader</option></select>
	</div>

	<h2>What to do</h2>
	<div class="pair" data-group="action">
		<button class="choice on" data-value="update"><b>Update to 1.4.0</b><span>The new TortOS and plastron. Games, music and saves stay.</span></button>
		<button class="choice erase" data-value="fresh"><b>Fresh install</b><span>Erases the whole card and starts over.</span></button>
	</div>

	<footer>
		<button class="ghost">Box art for this card</button>
		<button class="go" id="go">Update card</button>
	</footer>
	<div class="note" id="note">About 40 seconds. Nothing on the card is erased.</div>
</div>

<script src="app.js"></script>
</body>
</html>
